<!DOCTYPE html>
<html>
<head>
    <title>CallVision Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Extra styling to make images look good in the table */
        .table-img-logo {
            height: 40px;
            width: auto;
            object-fit: contain;
        }
        .table-img-banner {
            max-width: 100px;
            height: auto;
        }
        .verified-badge {
            background-color: #198754;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
        /* Limit table height so it doesn't stretch too long */
        .table-responsive {
            max-height: 600px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="container mt-4">

<h2>CallVision Admin</h2>

<!-- WebSocket Status -->
<div class="mb-3">
    <span>WebSocket Status: </span>
    <span id="wsStatus" style="font-weight: bold; color: orange;">Connecting...</span>
</div>
<div id="wsMessages" class="mb-3"></div>

<hr>

<!-- FORM -->
<div class="row mb-3">
    <div class="col-md-3">
        <input id="companyName" class="form-control" placeholder="Company Name">
    </div>
    <div class="col-md-3">
        <input id="phoneNumber" class="form-control" placeholder="Phone Number">
    </div>
    <div class="col-md-2">
        <input id="callReason" class="form-control" placeholder="Reason">
    </div>
    <!-- Inputs for Images -->
    <div class="col-md-2">
        <input id="logoUrl" class="form-control" placeholder="Logo URL">
    </div>
    <div class="col-md-2">
        <input id="bannerUrl" class="form-control" placeholder="Banner URL">
    </div>
    <div class="col-md-2">
        <input id="videoUrl" class="form-control" placeholder="Video URL">
    </div>
    <div class="col-md-1 d-flex align-items-center">
        <input type="checkbox" id="verified"> Verified
    </div>
    <div class="col-md-2 mt-2 mt-md-0">
        <button class="btn btn-primary w-100" onclick="saveCaller()">Save</button>
    </div>
</div>

<!-- TABLE -->
<div class="table-responsive">
    <table class="table table-bordered table-striped table-hover" id="callerTable">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Company</th>
            <th>Phone</th>
            <th>Reason</th>
            <th>Logo</th>
            <th>Banner</th>
            <th>Video</th>
            <th>Verified</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<script>
// ============ WEBSOCKET CLIENT ============
const wsUrl = `wss://${window.location.host}/ws/incoming-call`;
const ws = new WebSocket(wsUrl);

ws.onopen = () => {
    console.log('✅ WebSocket connected to CallVision backend');
    document.getElementById('wsStatus').textContent = '✅ Connected';
    document.getElementById('wsStatus').style.color = 'green';
};

ws.onmessage = (event) => {
    console.log('📨 WebSocket message:', event.data);
    const msgDiv = document.getElementById('wsMessages');
    if (msgDiv) {
        msgDiv.innerHTML += `<div>📨 ${event.data}</div>`;
    }
};

ws.onerror = (error) => {
    console.error('❌ WebSocket error:', error);
    document.getElementById('wsStatus').textContent = '❌ Error';
    document.getElementById('wsStatus').style.color = 'red';
};

ws.onclose = () => {
    console.log('🔌 WebSocket disconnected');
    document.getElementById('wsStatus').textContent = '🔌 Disconnected';
    document.getElementById('wsStatus').style.color = 'orange';
};
// ===========================================

// ============ FETCH AND RENDER TABLE ============
fetch('/api/callers')
.then(r=>r.json())
.then(data=>{
    let body=document.querySelector("#callerTable tbody");
    body.innerHTML = ""; // Clear existing rows just in case
    
    data.forEach(c=>{
        // Handle display for verified
        let verifiedDisplay = c.verified 
            ? '<span class="verified-badge">Yes</span>' 
            : '<span class="text-muted">No</span>';

        // Handle broken image links by showing a placeholder
        let logoImg = c.logo 
            ? `<img src="${c.logo}" class="table-img-logo" onerror="this.src='https://via.placeholder.com/40x40?text=Logo'">` 
            : 'N/A';
            
        let bannerImg = c.banner 
            ? `<img src="${c.banner}" class="table-img-banner" onerror="this.src='https://via.placeholder.com/100x40?text=Banner'">` 
            : 'N/A';

        // 🆕 ADDED: Handle video
        let videoHtml = c.videoRingback 
            ? `<video src="${c.videoRingback}" controls preload="none" width="120" style="max-height:60px; border-radius:4px;"></video>` 
            : 'N/A';

        body.innerHTML += `
<tr>
    <td>${c.id}</td>
    <td><strong>${c.companyName}</strong></td>
    <td>${c.phoneNumber}</td>
    <td>${c.callReason}</td>
    <td>${logoImg}</td>
    <td>${bannerImg}</td>
    <td>${videoHtml}</td> 
    <td>${verifiedDisplay}</td>
    <td>
        <button class="btn btn-warning btn-sm"
            onclick="editCaller(${c.id},
            '${c.companyName}',
            '${c.phoneNumber}',
            '${c.callReason}',
            '${c.logo || ''}',
            '${c.banner || ''}',
            '${c.videoRingback || ''}',
            ${c.verified})">
            Edit
        </button>
        <button class="btn btn-danger btn-sm"
            onclick="deleteCaller(${c.id})">
            Delete
        </button>
    </td>
</tr>
`;
    });
});

let editId = null;

// ============ SAVE / UPDATE ============
function saveCaller() {
    const caller = {
        companyName: document.getElementById("companyName").value,
        phoneNumber: document.getElementById("phoneNumber").value,
        callReason: document.getElementById("callReason").value,
        logo: document.getElementById("logoUrl").value,
        banner: document.getElementById("bannerUrl").value,
        videoRingback: document.getElementById("videoUrl").value,
        verified: document.getElementById("verified").checked
    };

    if (editId == null) {
        fetch('/api/callers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(caller)
        })
        .then(() => location.reload());
    } else {
        fetch('/api/callers/' + editId, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(caller)
        })
        .then(() => location.reload());
    }
}

// ============ DELETE ============
function deleteCaller(id) {
    if(confirm("Are you sure you want to delete this caller?")) {
        fetch('/api/callers/' + id, {
            method: 'DELETE'
        })
        .then(() => location.reload());
    }
}

// ============ EDIT (Populate Form) ============
function editCaller(id, company, phone, reason, logo, banner, video, verified) {
    editId = id;
    document.getElementById("companyName").value = company;
    document.getElementById("phoneNumber").value = phone;
    document.getElementById("callReason").value = reason;
    document.getElementById("logoUrl").value = logo;
    document.getElementById("bannerUrl").value = banner;
    document.getElementById("videoUrl").value = video; // 🆕 FIXED: Populate video input
    document.getElementById("verified").checked = verified;
}
</script>

</body>
</html>
